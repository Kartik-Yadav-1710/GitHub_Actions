name: Image Scan workflow
on:
    workflow_call:

jobs:
    Image_Scan_Trivy:
        strategy:
            matrix:
                image: ['${{ vars.DOCKERHUB_USERNAME }}/gym-management-system-frontend:latest', '${{ vars.DOCKERHUB_USERNAME }}/gym-management-system-backend:latest']
        
        runs-on: ubuntu-latest
        steps:
            - name: Code Checkout
              uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Setup Docker
              uses: docker/setup-docker-action@v4
              with:
                 version: latest

            - name: Docker login # Docker login to DockerHub
              uses: docker/login-action@v4
              with:
                 username: ${{ vars.DOCKERHUB_USERNAME }}
                 password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Frontend Docker Build # Frontend Docker Build
              working-directory: gym-management-system/frontend
              run: docker build --no-cache -t ${{ vars.DOCKERHUB_USERNAME }}/gym-management-system-frontend:latest .
            
            - name: Backend Docker Build # Backend Docker Build
              working-directory: gym-management-system/backend
              run: docker build --no-cache -t ${{ vars.DOCKERHUB_USERNAME }}/gym-management-system-backend:latest .
            
            - name: Run Trivy Scanning
              uses: aquasecurity/trivy-action@v0.36.0
              with:
               image-ref: ${{ matrix.image }}
               format: 'table'
               exit-code: '1'
               ignore-unfixed: true
               severity: 'CRITICAL,HIGH'