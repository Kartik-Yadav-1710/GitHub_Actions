name: Backend CI workflow
on:
  push:
    branches:
     - main 

  pull_request:
    branches:
     - main  
        
  workflow_dispatch:

jobs:
  Backend_Build_Test:

   strategy:
     matrix:
      python-versions: [3.12]

   runs-on: ubuntu-latest

   services:
      database-container:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ vars.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
   env: 
    DATABASE_URL: postgresql://${{ vars.POSTGRES_USER }}:${{ vars.POSTGRES_PASSWORD }}@127.0.0.1:5432/${{ vars.POSTGRES_DB }}

   steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-versions }} # Install Python

      - name: Install dependencies
        working-directory: gym-management-system/backend
        run: pip install -r requirements.txt # Install dependencies
      
      - name: Install Ruff and pytest
        working-directory: gym-management-system/backend
        run: pip install ruff pytest # Install Ruff and pytest

      - name: Lint Action
        working-directory: gym-management-system/backend
        run: ruff check . --fix # Check syntax errors
      - name: Run Tests
        working-directory: gym-management-system/backend
        run: pytest # Run test