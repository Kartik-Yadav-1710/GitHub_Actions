name: Docker Build CI workflow
on:
  ## push:
  ##  branches:
  ##    - main

  ## pull_request:
  ##  branches:
  ##    - main
  
 ## workflow_dispatch:

  workflow_run:
    workflows:
      - Frontend CI workflow
      - Backend CI workflow
      types:
        - completed
        
jobs:
  Docker_Build_Test:
      runs-on: ubuntu-latest
      steps:
        - name: Code Checkout
          uses: actions/checkout@v4

        - name: Setup Docker
          uses: docker/setup-docker-action@v4
          with:
            version: latest

        - name: Docker login # Docker login to DockerHub
          uses: docker/login-action@v4
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Frontend Docker Build # Frontend Docker Build
          working-directory: gym-management-system/frontend
          run: docker build -t ${{ vars.DOCKERHUB_USERNAME }}/gym-management-system-frontend:latest .
          
        - name: Backend Docker Build # Backend Docker Build
          working-directory: gym-management-system/backend
          run: docker build -t ${{ vars.DOCKERHUB_USERNAME }}/gym-management-system-backend:latest .

        - name: Push Frontend Docker Image # Push Frontend Docker Image to DockerHub
          run: docker push ${{ vars.DOCKERHUB_USERNAME }}/gym-management-system-frontend:latest

        - name: Push Backend Docker Image # Push Backend Docker Image to DockerHub
          run: docker push ${{ vars.DOCKERHUB_USERNAME }}/gym-management-system-backend:latest